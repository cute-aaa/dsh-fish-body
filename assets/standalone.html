<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>大肥鱼</title>
  <style>
    html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; width: 100%; height: 100%; }
    /* 浏览器独立窗口（Chrome/Edge --app=）不支持透明窗口：给一个深色底，看起来才像桌宠窗口 */
    html.opaque-host, html.opaque-host body { background: #20222b; }
    body { -webkit-app-region: drag; }
    body [data-fish-body] { -webkit-app-region: no-drag; }
  </style>
  <script>
    // Electron 的透明窗口才有意义；普通浏览器窗口必须给底色
    if (!/Electron\//.test(navigator.userAgent)) document.documentElement.className = 'opaque-host';
  </script>
</head>
<body>
  <script src="/fish-body-assets/core.js"></script>
  <script>
    (function () {
      var c = document.createElement('div');
      c.style.cssText = 'position:fixed;inset:0;pointer-events:none';
      document.body.appendChild(c);
      var api = FishBodyCore.mount(c, { standalone: true });
      window.addEventListener('beforeunload', function () { api.dispose(); });
    })();
  </script>
</body>
</html>
